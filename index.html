.speaker-hero h1 {
  font-size: 34px;
  font-weight: 700;
  margin: 20px 0 26px;
  color: var(--ink);
}

.speaker-hero .searchbox {
  max-width: 560px;
  margin: 0 auto;
  box-shadow: var(--shadow);
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}

.rcard {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 28px 20px;
  text-align: center;
  transition: .18s;
}

.rcard:hover {
  box-shadow: var(--shadow);
  transform: translateY(-3px);
}

.avatar {
  width: 82px;
  height: 82px;
  border-radius: 50%;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Grotesk';
  font-weight: 700;
  font-size: 23px;
  color: #fff;
  border: 3px solid var(--red-50);
}

.rcard h4 {
  font-size: 15px;
  font-weight: 700;
}

.rcard .pos {
  font-size: 12px;
  color: var(--ink-soft);
  margin: 4px 0 12px;
}

.rtags {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.rtag {
  font-size: 10.5px;
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--red-50);
  color: var(--red);
  border: 1px solid var(--red-100);
  font-weight: 700;
}

.rlink {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--red);
  border-top: 1px solid var(--line);
  padding-top: 14px;
  width: 100%;
  justify-content: center;
}

/* ---- calendar/timeline ---- */
.timeline-month {
  margin-bottom: 6px;
}

.timeline-month .mtitle {
  font-family: 'Space Grotesk';
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--red);
  text-transform: uppercase;
  margin: 30px 0 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.timeline-month .mtitle::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}

.tl-item {
  display: flex;
  gap: 18px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 10px;
  align-items: center;
}

.tl-date {
  width: 56px;
  flex: none;
  text-align: center;
  background: var(--red-50);
  border: 1px solid var(--red-100);
  border-radius: 10px;
  padding: 8px 4px;
}

.tl-date .d {
  font-family: 'JetBrains Mono';
  font-size: 19px;
  font-weight: 700;
  color: var(--red-700);
  display: block;
}

.tl-date .m {
  font-size: 10.5px;
  color: var(--red);
  font-weight: 600;
}

.tl-info {
  flex: 1;
}

.tl-info h4 {
  font-size: 14.5px;
  font-weight: 700;
  margin-bottom: 3px;
}

.tl-info .meta {
  font-size: 12px;
  color: var(--ink-soft);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

/* ---- news ---- */
.news-list {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  overflow: hidden;
}

.news-item {
  display: flex;
  gap: 20px;
  padding: 20px 22px;
  border-bottom: 1px solid var(--line);
  align-items: flex-start;
}

.news-item:last-child {
  border-bottom: none;
}

.news-date {
  font-family: 'JetBrains Mono';
  font-size: 12px;
  color: var(--red);
  background: var(--red-50);
  border: 1px solid var(--red-100);
  border-radius: 8px;
  padding: 8px 10px;
  text-align: center;
  min-width: 62px;
}

.news-date .d {
  font-size: 17px;
  font-weight: 600;
  display: block;
}

.news-body h4 {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}

.news-body p {
  font-size: 12.5px;
  color: var(--ink-soft);
}

/* ---- video gallery ---- */
.video-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.video-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: .18s;
}

.video-card:hover {
  box-shadow: var(--shadow);
  transform: translateY(-3px);
  border-color: #f1d6d8;
}

.video-thumb {
  position: relative;
  aspect-ratio: 16/9;
  background: linear-gradient(135deg, #3a1017, #5c0f18);
  background-size: cover;
  background-position: center;
}

.video-thumb::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(20, 8, 10, 0.22);
}

.video-play-badge {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-play-badge .icon {
  width: 52px;
  height: 52px;
  color: #fff;
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
}

.video-card h4 {
  font-size: 14.5px;
  font-weight: 700;
  padding: 14px 16px;
  line-height: 1.4;
}

.video-modal-body {
  padding: 0;
}

.video-embed-wrap {
  position: relative;
  aspect-ratio: 16/9;
  background: #000;
}

.video-embed-wrap iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}

/* ===== SCROLL REVEAL ===== */
.reveal {
  opacity: 0;
  transform: translateY(26px);
  transition: opacity .7s cubic-bezier(.2, .7, .3, 1), transform .7s cubic-bezier(.2, .7, .3, 1);
}

.reveal.in {
  opacity: 1;
  transform: none;
}

.reveal-stagger.in>* {
  opacity: 1;
  transform: none;
}

.reveal-stagger>* {
  opacity: 0;
  transform: translateY(22px);
  transition: opacity .6s ease, transform .6s ease;
}

.reveal-stagger.in>*:nth-child(1) {
  transition-delay: .03s;
}

.reveal-stagger.in>*:nth-child(2) {
  transition-delay: .1s;
}

.reveal-stagger.in>*:nth-child(3) {
  transition-delay: .17s;
}

.reveal-stagger.in>*:nth-child(4) {
  transition-delay: .24s;
}

.reveal-stagger.in>*:nth-child(5) {
  transition-delay: .31s;
}

.reveal-stagger.in>*:nth-child(6) {
  transition-delay: .38s;
}

/* ===== BANNER CAROUSEL ===== */
.banner-wrap {
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  background: var(--ink);
}

.banner-track {
  display: flex;
  transition: transform .55s cubic-bezier(.3, .7, .2, 1);
}

.banner-slide {
  min-width: 100%;
  position: relative;
  aspect-ratio: 2/1;
  min-height: 320px;
  max-height: 560px;
  display: flex;
  align-items: center;
  color: #fff;
  padding: 52px 68px;
  background-size: cover;
  background-position: center;
}

.banner-slide::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, rgba(28, 10, 13, 0.9) 15%, rgba(92, 15, 24, 0.5) 50%, rgba(92, 15, 24, 0.1) 100%);
}

.banner-slide .bcontent {
  position: relative;
  z-index: 1;
  max-width: 620px;
}

.banner-slide .beyebrow {
  display: inline-block;
  font-family: 'Space Grotesk';
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: var(--gold);
  color: #2a1c06;
  padding: 6px 13px;
  border-radius: 999px;
  margin-bottom: 14px;
}

.banner-slide h3 {
  font-size: 36px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 14px;
}

.banner-slide p {
  font-size: 15.5px;
  color: rgba(255, 255, 255, 0.82);
  margin-bottom: 24px;
  max-width: 520px;
}

.banner-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.banner-nav:hover {
  background: rgba(255, 255, 255, 0.3);
}

.banner-nav.prev {
  left: 20px;
}

.banner-nav.next {
  right: 20px;
}

.banner-nav.prev svg {
  transform: rotate(180deg);
}

.banner-dots {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 7px;
  z-index: 2;
}

.banner-dots button {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.4);
}

.banner-dots button.active {
  background: var(--gold);
  width: 22px;
  border-radius: 5px;
}

/* ===== COURSE POSTER CAROUSEL (A4 portrait) ===== */
.poster-track-wrap {
  overflow-x: auto;
  scroll-behavior: smooth;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.poster-track-wrap::-webkit-scrollbar {
  display: none;
}

.poster-track {
  display: flex;
  gap: 24px;
  padding: 4px 6px 14px;
}

.poster-card {
  min-width: 380px;
  max-width: 380px;
  aspect-ratio: 210/297;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #fff;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  scroll-snap-align: start;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
  position: relative;
}

.poster-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 22px 44px -16px rgba(92, 15, 24, 0.32);
}

.poster-nav {
  position: absolute;
  top: calc(50% - 20px);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--red);
  z-index: 2;
}

.poster-nav.prev {
  left: -18px;
}

.poster-nav.next {
  right: -18px;
}

.poster-nav.prev svg {
  transform: rotate(180deg);
}

.poster-nav:hover {
  background: var(--red-50);
}

.poster-img {
  flex: 1;
  position: relative;
  background-size: cover;
  background-position: center;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 22px;
  color: #fff;
}

.poster-img.fallback {
  background: linear-gradient(135deg, var(--red-900), var(--red) 55%, var(--gold));
}

.poster-img::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.2) 0%, transparent 30%, rgba(0, 0, 0, 0.75) 100%);
}

.poster-img .ptag {
  position: relative;
  z-index: 1;
  align-self: flex-start;
  font-size: 12px;
  font-weight: 700;
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(3px);
  padding: 5px 12px;
  border-radius: 999px;
}

.poster-body {
  position: relative;
  z-index: 1;
  width: 100%;
}

.poster-body h4 {
  font-size: 19px;
  font-weight: 700;
  line-height: 1.5;
  margin-bottom: 12px;
}

.poster-body .meta {
  font-size: 12.5px;
  color: rgba(255, 255, 255, 0.85);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 14px;
}

.poster-body .poster-cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: var(--red);
  padding: 10px 18px;
  border-radius: 999px;
  transition: background .15s;
}

.poster-card:hover .poster-body .poster-cta {
  background: var(--red-700);
}

.poster-dots {
  display: flex;
  justify-content: center;
  gap: 7px;
  margin-top: 20px;
}

.poster-dots button {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: none;
  background: var(--red-100);
}

.poster-dots button.active {
  background: var(--red);
  width: 22px;
  border-radius: 5px;
}

/* ===== RESEARCH HIGHLIGHTS (blue/white) ===== */
.research-block {

  overflow: hidden;
}

.research-block::before {
  content: '';

}

.research-block .section-head h2,
.research-block .headbar h2 {

}

.research-block .section-head p {

.rh-body .rhtag,

.rh-body .rhfield {

.rh-body .rhlink {

/* ===== NEWS (image cards) ===== */

.news-card {

.news-card-body h4 {

.dash-top .row1 {

  flex-wrap: wrap;

.dash-top h1 {

}

.dash-top .sub {

  align-items: center;

.daterange {

.daterange input {

.astat .l {

.astat .bar-fill {

.a1 {

.a2 {

}

.a3 {
  background: linear-gradient(135deg, #6a49c9, #7c5cd6);
}

.a4 {
  background: linear-gradient(135deg, #5a3ec2, #8067dc);
}

.a5 {
  background: linear-gradient(135deg, #128a4e, #1a9c5b);
}

.a6 {
  background: linear-gradient(135deg, #c8862a, #dba248);
}

.a7 {
  background: linear-gradient(135deg, #1f8f88, #2ba8a0);
}

.panels-4 {

  gap: 16px;
  margin-bottom: 22px;

.panel {

}

.panel-pad {

}

.tax-chips {

  gap: 8px;
}

.tax-chip {

  align-items: center;

  background: var(--red-50);

  border-radius: 999px;
  padding: 6px 8px 6px 14px;
  font-size: 13px;
  font-weight: 600;
}

.tax-chip button {

  align-items: center;
  justify-content: center;

.tax-chip button svg {

}

.tax-chip button:hover {

.panel-head {

  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
}

.panel-head h3 {

    try {

      const r2 = await retryAsync(() => window.storage.set(key, JSON.stringify(this.data[key]), true));

          function byteSize(durl) { const i = durl.indexOf(','); return Math.ceil((durl.length - i - 1) * 0.75); }
          if (opts.png) {
            let pw = Math.min(img.width || startWidth, startWidth);
            let png = draw(pw).toDataURL('image/png');
            let pg = 0;
            while (byteSize(png) > targetBytes && pw > 120 && pg < 20) { pg++; pw = Math.max(120, Math.round(pw * 0.85)); png = draw(pw).toDataURL('image/png'); }
            resolve(png); return;
          }
          let width = Math.min(img.width || startWidth, startWidth);
          let quality = startQuality;
          let canvas = draw(width);
          let out = canvas.toDataURL('image/jpeg', quality);
          let guard = 0;
          /* shrink quality first (cheap), then dimensions, until it comfortably fits — works the same whether the
             original photo is tiny or huge, so uploads never fail for being "too big". */
          while (byteSize(out) > targetBytes && guard < 18) {
            guard++;
            if (quality > minQuality) quality = Math.max(minQuality, quality - 0.1);
            else if (width > minWidth) { width = Math.max(minWidth, Math.round(width * 0.85)); canvas = draw(width); }
            else break;
            out = canvas.toDataURL('image/jpeg', quality);
          }
          resolve(out);
        } catch (err) { reject(err); }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
/* Re-compress an already-produced data URL even harder — used as an automatic fallback when a save is
   rejected for size, so the person never has to guess a "safe" file size themselves. */
function compressDataUrl(dataUrl, targetBytes, minWidth, minQuality) {
  targetBytes = targetBytes || 90 * 1024; minWidth = minWidth || 300; minQuality = minQuality || 0.25;
  return new Promise((resolve) => {
    if (!dataUrl || typeof dataUrl !== 'string' || !dataUrl.startsWith('data:image')) { resolve(dataUrl); return; }
    const img = new Image();
    img.onerror = () => resolve(dataUrl);
    img.onload = () => {
      try {
        function draw(w) {
          const h = Math.max(1, Math.round(img.height * w / img.width));
          const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          return canvas;
        }
        function byteSize(durl) { const i = durl.indexOf(','); return Math.ceil((durl.length - i - 1) * 0.75); }
        let width = Math.min(img.width, 700);
        let quality = 0.55;
        let canvas = draw(width);
        let out = canvas.toDataURL('image/jpeg', quality);
        let guard = 0;
        while (byteSize(out) > targetBytes && guard < 18) {
          guard++;
          if (quality > minQuality) quality = Math.max(minQuality, quality - 0.08);
          else if (canvas.width > minWidth) { width = Math.max(minWidth, Math.round(canvas.width * 0.82)); canvas = draw(width); }
          else break;
          out = canvas.toDataURL('image/jpeg', quality);
        }
        resolve(out);
      } catch (e) { resolve(dataUrl); }
    };
    img.src = dataUrl;
  });
}
/* Walk a stored collection and shrink any embedded base64 image fields harder — the automatic retry path. */
function shrinkEmbeddedImages(node, targetBytes, tasks) {
  tasks = tasks || [];
  const IMG_FIELDS = ['imageUrl', 'posterImage', 'photoUrl', 'heroImage', 'thumbnail'];
  if (Array.isArray(node)) { node.forEach(n => shrinkEmbeddedImages(n, targetBytes, tasks)); return tasks; }
  if (node && typeof node === 'object') {
    IMG_FIELDS.forEach(f => {
      if (typeof node[f] === 'string' && node[f].startsWith('data:image')) {
        tasks.push(compressDataUrl(node[f], targetBytes).then(out => { node[f] = out; }));
      }
    });
    Object.keys(node).forEach(k => { const v = node[k]; if (v && typeof v === 'object') shrinkEmbeddedImages(v, targetBytes, tasks); });
  }
  return tasks;
}

/* ---- scroll reveal ---- */
function initReveal() {
  const els = document.querySelectorAll('.reveal, .reveal-stagger');
  if (!els.length) return;
  if (typeof IntersectionObserver === 'undefined') { els.forEach(el => el.classList.add('in')); return; }
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
  }, { threshold: 0.12 });
  els.forEach(el => obs.observe(el));
}

/* ---- carousels ---- */
function carouselLen(key) {
  if (key === 'banner') return Math.max(1, store.data.banners.length);
  return Math.max(1, filteredProjects().slice(0, 12).length);
}
function refreshBannerCarousel() {
  const track = document.getElementById('banner-track'); if (!track) return;
  track.style.transform = `translateX(-${state.carousel.banner * 100}%)`;
  document.querySelectorAll('.banner-dots button').forEach((b, i) => b.classList.toggle('active', i === state.carousel.banner));
}
function refreshPosterCarousel(instant) {
  const wrap = document.getElementById('poster-carousel'); if (!wrap) return;
  const left = state.carousel.poster * POSTER_STEP;
  if (instant || typeof wrap.scrollTo !== 'function') wrap.scrollLeft = left;
  else wrap.scrollTo({ left, behavior: 'smooth' });
  document.querySelectorAll('#poster-dots button').forEach((b, i) => b.classList.toggle('active', i === state.carousel.poster));
}
function carouselRefresh(key) { key === 'banner' ? refreshBannerCarousel() : refreshPosterCarousel(false); }
function tickCarousels() {
  if (state.publicTab !== 'home') return;
  if (document.getElementById('banner-track')) { const len = carouselLen('banner'); if (len > 1) { state.carousel.banner = (state.carousel.banner + 1) % len; refreshBannerCarousel(); } }
  if (document.getElementById('poster-carousel')) { const len = carouselLen('poster'); if (len > 1) { state.carousel.poster = (state.carousel.poster + 1) % len; refreshPosterCarousel(false); } }
}
if (!carouselTimer) carouselTimer = setInterval(tickCarousels, 5000);

function bindEvents() {
  document.querySelectorAll('[data-action="nav-item"]').forEach(el => el.addEventListener('click', e => {
    e.preventDefault(); resetOverlays();
    state.publicTab = el.getAttribute('data-tab');
    document.querySelectorAll('.nav-dropdown-panel.open').forEach(p => p.classList.remove('open'));
    const anchor = el.getAttribute('data-anchor');
    render();
    if (anchor) setTimeout(() => { const t = document.getElementById(anchor); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80);
  }));
  document.querySelectorAll('[data-action="toggle-dropdown"]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    const key = el.getAttribute('data-key');
    document.querySelectorAll('.nav-dropdown-panel').forEach(p => {
      if (p.getAttribute('data-key') === key) p.classList.toggle('open'); else p.classList.remove('open');
    });
  }));
  if (!navOutsideClickBound) {
    document.addEventListener('click', () => { document.querySelectorAll('.nav-dropdown-panel.open').forEach(p => p.classList.remove('open')); });
    navOutsideClickBound = true;
  }
  const gc = document.querySelector('[data-action="goto-catalog"]'); if (gc) gc.addEventListener('click', () => { resetOverlays(); state.publicTab = 'catalog'; render(); });
  const gn = document.querySelector('[data-action="goto-news"]'); if (gn) gn.addEventListener('click', () => { resetOverlays(); state.publicTab = 'news'; render(); });

  // carousels
  document.querySelectorAll('[data-action="carousel-prev"],[data-action="carousel-next"],[data-action="carousel-dot"]').forEach(el => el.addEventListener('click', () => {
    const key = el.getAttribute('data-carousel'); const len = carouselLen(key); const action = el.getAttribute('data-action');
    if (action === 'carousel-prev') state.carousel[key] = (state.carousel[key] - 1 + len) % len;
    else if (action === 'carousel-next') state.carousel[key] = (state.carousel[key] + 1) % len;
    else state.carousel[key] = Number(el.getAttribute('data-index'));
    carouselRefresh(key);
  }));

  // news detail
  document.querySelectorAll('[data-action="view-news"]').forEach(el => el.addEventListener('click', () => { state.detailNews = el.getAttribute('data-id'); state.newsImg = 0; render(); }));
  const newsLen = () => { const n = store.data.news.find(x => x.id === state.detailNews); return n ? newsImages(n).length : 0; };
  const gp = document.querySelector('[data-action="news-img-prev"]'); if (gp) gp.addEventListener('click', () => { const L = newsLen(); state.newsImg = ((state.newsImg || 0) - 1 + L) % L; render(); });
  const gx = document.querySelector('[data-action="news-img-next"]'); if (gx) gx.addEventListener('click', () => { const L = newsLen(); state.newsImg = ((state.newsImg || 0) + 1) % L; render(); });
  document.querySelectorAll('[data-action="news-img-pick"]').forEach(el => el.addEventListener('click', () => { state.newsImg = Number(el.getAttribute('data-index')); render(); }));
  document.querySelectorAll('[data-action="close-newsdetail"]').forEach(el => el.addEventListener('click', () => { state.detailNews = null; render(); }));
  const ndbg = document.querySelector('[data-action="close-newsdetail-bg"]'); if (ndbg) ndbg.addEventListener('click', () => { state.detailNews = null; render(); });

  // video detail
  document.querySelectorAll('[data-action="view-video"]').forEach(el => el.addEventListener('click', () => { state.detailVideo = el.getAttribute('data-id'); render(); }));
  document.querySelectorAll('[data-action="close-videodetail"]').forEach(el => el.addEventListener('click', () => { state.detailVideo = null; render(); }));
  const vdbg = document.querySelector('[data-action="close-videodetail-bg"]'); if (vdbg) vdbg.addEventListener('click', () => { state.detailVideo = null; render(); });

  const si = document.getElementById('search-input'); if (si) si.addEventListener('input', () => { state.search = si.value; refreshCatalog(); });
  document.querySelectorAll('[data-cat]').forEach(el => el.addEventListener('click', () => { state.category = el.getAttribute('data-cat'); render(); }));
  document.querySelectorAll('[data-status]').forEach(el => el.addEventListener('click', () => { state.status = el.getAttribute('data-status'); render(); }));
  const orgSel = document.getElementById('org-select'); if (orgSel) orgSel.addEventListener('change', () => { state.org = orgSel.value; render(); });
  const clrf = document.querySelector('[data-action="clear-filters"]'); if (clrf) clrf.addEventListener('click', () => { state.category = 'ทั้งหมด'; state.status = 'ทั้งหมด'; state.org = 'หน่วยงานทั้งหมด'; state.search = ''; render(); });
  document.querySelectorAll('[data-viewmode]').forEach(el => el.addEventListener('click', () => { state.viewMode = el.getAttribute('data-viewmode'); render(); }));

  const ss = document.getElementById('speaker-search'); if (ss) ss.addEventListener('input', () => { state.speakerSearch = ss.value; refreshSpeakers(); });

  // project detail modal
  document.querySelectorAll('[data-action="view-project"]').forEach(el => el.addEventListener('click', () => { state.detailProject = el.getAttribute('data-id'); render(); }));
  document.querySelectorAll('[data-action="close-detail"]').forEach(el => el.addEventListener('click', () => { state.detailProject = null; render(); }));
  const dbg = document.querySelector('[data-action="close-detail-bg"]'); if (dbg) dbg.addEventListener('click', () => { state.detailProject = null; render(); });

  // research highlight detail modal
  document.querySelectorAll('[data-action="view-research"]').forEach(el => el.addEventListener('click', () => { state.detailResearch = el.getAttribute('data-id'); render(); }));
  document.querySelectorAll('[data-action="close-researchdetail"]').forEach(el => el.addEventListener('click', () => { state.detailResearch = null; render(); }));
  const rdbg = document.querySelector('[data-action="close-researchdetail-bg"]'); if (rdbg) rdbg.addEventListener('click', () => { state.detailResearch = null; render(); });
  const regBtn = document.querySelector('[data-action="register-project"]');
  if (regBtn) regBtn.addEventListener('click', async () => {
    const id = regBtn.getAttribute('data-id');
    const p = store.data.projects.find(x => x.id === id);
    if (!p || p.applied >= p.seats) return;
    p.applied++;
    p.reg.external++;
    await store.saveKey('projects');
    render();
    toast('สมัครเข้าร่วมโครงการเรียบร้อยแล้ว');
  });

  // project comments
  const cmBtn = document.querySelector('[data-action="submit-comment"]');
  if (cmBtn) cmBtn.addEventListener('click', async () => {
    const pid = cmBtn.getAttribute('data-id');
    const nameEl = document.getElementById('c-name'), textEl = document.getElementById('c-text');
    const name = nameEl.value.trim(), text = textEl.value.trim();
    if (!text) { textEl.focus(); return; }
    cmBtn.disabled = true; cmBtn.textContent = 'กำลังส่ง...';
    const today = new Date().toISOString().slice(0, 10);
    const obj = { id: uid('c'), projectId: pid, name: name || 'ผู้เยี่ยมชม', text, date: today };
    const ok = await store.addComment(obj);
    render();
    toast(ok ? 'ส่งความคิดเห็นเรียบร้อยแล้ว' : 'ส่งความคิดเห็นไม่สำเร็จ กรุณาลองใหม่');
  });
}

function refreshCatalog() {
  const grid = document.getElementById('course-grid'); if (!grid) return;
  const list = filteredProjects();
  grid.innerHTML = list.length ? list.map(state.viewMode === 'list' ? projectListRow : projectCard).join('') : `<div style="grid-column:1/-1; text-align:center; padding:50px; color:#a99a9c;">ไม่พบหลักสูตรที่ตรงกับเงื่อนไขการค้นหา</div>`;
  const badge = document.querySelector('.count-badge'); if (badge) badge.innerHTML = `${icon('cap', '')}${list.length} Courses Available`;
  const el = document.getElementById('search-input'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
function refreshSpeakers() {
  const grid = document.getElementById('speaker-grid'); if (!grid) return;
  const q = state.speakerSearch.toLowerCase();
  const list = store.data.researchers.filter(r => !q || (r.name + r.pos).toLowerCase().includes(q));
  grid.innerHTML = list.length ? list.map((r, i) => `
  <div class="rcard"><div class="avatar" style="background:${AVATAR_COLORS[i % AVATAR_COLORS.length]}">${initials(r.name)}</div>
  <h4>${r.name}</h4><div class="pos">${r.pos}</div><div class="rtags">${r.tags.map(t => `<span class="rtag">${t}</span>`).join('')}</div>
  <a href="#" class="rlink">${icon('book', '')}ดูข้อมูลเพิ่มเติม</a></div>`).join('')
    : `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#a99a9c;">ไม่พบวิทยากรที่ค้นหา</div>`;
  const el = document.getElementById('speaker-search'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}


/* ============================================================ INIT ============================================================ */
bootApp();

</script>
</body>

</html>
